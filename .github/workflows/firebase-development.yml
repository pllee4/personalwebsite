# https://github.com/firebase/firebase-tools

name: Development

"on":
  push:
    branches-ignore:
      - master
      - devel

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          # Pin node version to the following due bug firebase hosting throws error on success deployment. See:
          # https://github.com/FirebaseExtended/action-hosting-deploy/issues/460
          # https://github.com/firebase/firebase-tools/issues/10716#issuecomment-4800040219
          node-version: "24.18.0"
      # Setup the flutter environment.
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable" # 'dev', 'alpha', default to: 'stable'
      - run: dart pub get
      - run: flutter config --enable-web && flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PINLOON_LEE }}"
          expires: 30d
          channelId: development
          projectId: pinloon-lee
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
